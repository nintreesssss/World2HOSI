<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="World2HOSI: A Multi-Expert Harness for Long-Horizon Human-Object-Scene Interaction Generation. Explore an interactive 3D teaser.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>World2HOSI</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=10">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/postprocessing/Pass.js":"./vendor/Pass.js","@sparkjsdev/spark":"./vendor/spark.module.js"}}</script>
</head>
<body>
  <main>
    <header class="paper-heading">
      <h1><span class="project-name">World2HOSI</span><span class="paper-title">A Multi-Expert Harness for Long-Horizon<br class="desktop-break"> Human-Object-Scene Interaction Generation</span></h1>
    </header>
    <section class="teaser is-loading" id="teaser" aria-label="Interactive 3D teaser" aria-busy="true">
      <div class="viewer-shell" id="viewer-shell">
        <div id="viewport" role="img" aria-label="Interactive reconstructed home with six animated human-object interactions"></div>
        <div class="viewer-topbar">
          <div class="view-tools">
            <button id="reset-camera" title="Reset the camera" aria-label="Reset camera" disabled><svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1 0 6M4 4v5h5"/></svg><span>Reset view</span></button>
            <button id="fullscreen" title="Enter fullscreen" aria-label="Enter fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
          </div>
        </div>
        <div class="loading" id="loading"><progress id="load-progress" max="100" value="0" aria-label="Loading 3D scene"></progress></div>
        <span id="load-status" class="sr-only" role="status" aria-live="polite">Loading 3D scene</span>
        <div class="viewer-hint" id="viewer-hint">Drag to explore <span>·</span> Scroll to zoom</div>
      <div class="playback" aria-label="Animation playback controls">
        <div class="transport">
          <button id="play" class="play-button" aria-label="Play animation" disabled><svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4L13 7.5L13 16.5L7 20Z"/><path d="M13 7.5L20 12L20 12L13 16.5Z"/></svg></button>
          <button id="replay" class="icon-button" aria-label="Replay from the beginning" title="Replay" disabled><svg viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 9M3 4v6h6"/></svg></button>
          <div class="time-label"><span id="current-time">0:00.0</span><span class="time-separator">/</span><span id="duration">0:22.0</span></div>
        </div>
        <div class="timeline-control">
          <span class="timeline-rail" aria-hidden="true"><span class="timeline-fill"></span></span>
          <input id="timeline" type="range" min="0" max="22.0333" step="0.01" value="0" aria-label="Animation time" disabled>
          <span class="timeline-thumb" aria-hidden="true"></span>
        </div>
        <div class="play-options">
          <div class="speed-control">
            <label class="speed-label" for="speed">Speed</label><select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
            <button id="speed-toggle" aria-label="Playback speed, 1×" aria-haspopup="listbox" aria-expanded="false" aria-controls="speed-menu" hidden><span id="speed-value">1×</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
            <div id="speed-menu" class="speed-menu" role="listbox" aria-label="Playback speed" aria-hidden="true" inert>
              <button role="option" data-speed="0.5" aria-selected="false" tabindex="-1">0.5×<span aria-hidden="true">✓</span></button>
              <button role="option" data-speed="1" aria-selected="true" tabindex="-1">1×<span aria-hidden="true">✓</span></button>
              <button role="option" data-speed="1.5" aria-selected="false" tabindex="-1">1.5×<span aria-hidden="true">✓</span></button>
              <button role="option" data-speed="2" aria-selected="false" tabindex="-1">2×<span aria-hidden="true">✓</span></button>
            </div>
          </div>
          <button id="loop" class="icon-button" aria-label="Loop playback" aria-pressed="true" title="Loop playback"><svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4m14-1v3a2 2 0 0 1-2 2H3"/></svg></button>
        </div>
      </div>
      </div>
      <div id="actions" class="actions" role="group" aria-label="Select an interaction to explore">
        <button data-track="all" class="action active" aria-label="All actions" data-label="All actions" aria-pressed="true" disabled><span class="dot all-colors" aria-hidden="true"></span></button>
        <button data-track="chair" class="action" aria-label="Move the chair" data-label="Move the chair" aria-pressed="false" disabled><span class="dot" style="--track-color:#3175b4" aria-hidden="true"></span></button>
        <button data-track="piano" class="action" aria-label="Play the piano" data-label="Play the piano" aria-pressed="false" disabled><span class="dot" style="--track-color:#8958b9" aria-hidden="true"></span></button>
        <button data-track="kitchen" class="action" aria-label="Wash the dishes" data-label="Wash the dishes" aria-pressed="false" disabled><span class="dot" style="--track-color:#d37536" aria-hidden="true"></span></button>
        <button data-track="sofa" class="action" aria-label="Sit on the sofa" data-label="Sit on the sofa" aria-pressed="false" disabled><span class="dot" style="--track-color:#57994c" aria-hidden="true"></span></button>
        <button data-track="fruit" class="action" aria-label="Carry the fruit" data-label="Carry the fruit" aria-pressed="false" disabled><span class="dot" style="--track-color:#319ba7" aria-hidden="true"></span></button>
        <button data-track="bowl" class="action" aria-label="Inspect the bowl" data-label="Inspect the bowl" aria-pressed="false" disabled><span class="dot" style="--track-color:#bb4285" aria-hidden="true"></span></button>
      </div>
      <p id="action-caption" class="caption" aria-live="polite" hidden></p>
    </section>
  </main>
  <script type="module" src="ui.js?v=9"></script>
  <script type="module" src="viewer.js?v=8"></script>
</body>
</html>
